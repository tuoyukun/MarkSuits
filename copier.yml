# Copier template for a Mark-managed project.
# Generate:  copier copy gh:<owner>/MarkSuits <dest> --vcs-ref <tag>
# Upgrade:   copier update -a .mark/.copier-answers.yml   (3-way merge against the recorded answers)
_subdirectory: template/project
_answers_file: .mark/.copier-answers.yml
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name

locale:
  type: str
  help: Language for role prompts, artifacts and hook messages
  choices:
    English (en): en
    中文 (zh-CN): zh-CN
  default: en

profile:
  type: str
  help: Role pack
  choices:
    Web full-stack (designer / coder-plan / coder-impl / tester / fix-plan): web-fullstack
  default: web-fullstack

main_branch:
  type: str
  default: main

frontend_dir:
  type: str
  default: frontend

backend_dir:
  type: str
  default: backend

ui_dir:
  type: str
  help: Presentational UI directory owned exclusively by the designer role
  default: "{{ frontend_dir }}/src/ui"

tests_dir:
  type: str
  default: tests

regression_cmd:
  type: str
  help: Full regression command `mark merge` runs before a ticket lands on main (empty for none)
  default: ""

worktree_setup:
  type: str
  help: Command run in every new worktree before an agent works there, e.g. `npm ci` (empty for none)
  default: ""
