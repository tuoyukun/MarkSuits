<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Board</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--app:#f7f7f8;--panel:#ffffff;--line:#ebebed;--line2:#f1f1f3;--hover:#f0f0f2;
  --text:#1b1b1f;--text2:#5b5b66;--mute:#8e8e99;--faint:#c4c4cc;
  --brand:#5e6ad2;--brand-soft:#eef0fc;--human:#e8833a;--human-soft:#fdf1e7;--ok:#3f9f6b;--bad:#d8524e;
  --c-req:#a37cf0;--c-des:#e5629b;--c-plan:#3d9be9;--c-dev:#f2c94c;--c-qa:#4cb782;--c-merge:#5e6ad2;--c-block:#eb5757;--c-done:#95a2b3;
  --shadow:0 1px 1px rgba(0,0,0,.03);
  --shadow-lg:0 24px 64px rgba(16,24,40,.18),0 2px 8px rgba(16,24,40,.08);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101012;--app:#0b0b0d;--panel:#17171a;--line:#232327;--line2:#1c1c20;--hover:#1d1d21;
  --text:#ededf0;--text2:#a5a5ae;--mute:#6f6f79;--faint:#43434b;--brand-soft:#23253a;--human-soft:#2c1f14;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 64px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{--bg:#101012;--app:#0b0b0d;--panel:#17171a;--line:#232327;--line2:#1c1c20;--hover:#1d1d21;--text:#ededf0;--text2:#a5a5ae;--mute:#6f6f79;--faint:#43434b;--brand-soft:#23253a;--human-soft:#2c1f14;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 64px rgba(0,0,0,.6)}
*{box-sizing:border-box}
:root{accent-color:var(--brand)}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--text);font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.sb{display:flex;flex-direction:column;padding:10px 8px;gap:1px;border-right:1px solid var(--line);min-width:0}
.ws{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;min-width:0}
.logo{width:20px;height:20px;border-radius:5px;background:var(--text);display:grid;place-items:center;color:var(--bg);font-weight:700;font-size:11px;flex:none}
.ws b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws small{display:block;color:var(--mute);font-size:11px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:5px;color:var(--text2);font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--hover);color:var(--text)}
.nav svg{width:15px;height:15px;flex:none;color:var(--mute)}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.nav .n.h{color:var(--human);font-weight:600}
.nav .n.h:empty,.nav .n.h.zero{display:none}
.sbh{font-size:11.5px;font-weight:500;color:var(--mute);padding:14px 8px 4px}
.sbfoot{margin-top:auto;padding:8px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.live{display:flex;align-items:center;gap:7px;color:var(--text2)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.sbfoot code{font-family:var(--mono);font-size:11px}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg);border-radius:8px;margin:8px 8px 8px 0;border:1px solid var(--line);overflow:hidden}
.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);flex:none}
.crumb{display:flex;gap:6px;align-items:center;font-weight:500;white-space:nowrap}
.crumb span{color:var(--mute);font-weight:400}
.seg{display:flex;gap:2px}
.seg button{border:1px solid transparent;background:none;padding:2px 9px;border-radius:5px;color:var(--mute);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);border-color:var(--line)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:5px;padding:0 8px;height:26px;width:220px;color:var(--mute)}
.search input{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--text);min-width:0}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--mute)}
.content{flex:1;overflow:auto;min-height:0}
.stats{display:flex;align-items:center;gap:6px;padding:0 0 0 10px;overflow-x:auto;flex:0 1 auto;min-width:0;scrollbar-width:none}
.chip{height:24px;padding:0 8px;border-radius:5px;border:1px dashed var(--line);background:none;color:var(--text2);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.chip:hover{background:var(--hover)}
.chip.on{border-style:solid;border-color:var(--text2);color:var(--text)}
.chip.h{border:1px solid transparent;background:var(--human-soft);color:var(--human)}.chip.h b{color:var(--human)}
.chip.h.on{border-color:var(--human)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.content:has(>.board){display:flex;flex-direction:column}
.board{display:flex;gap:12px;padding:4px 20px 24px;align-items:stretch;flex:1 0 auto;width:max-content;min-width:100%}
.col{flex:0 0 280px;width:280px;display:flex;flex-direction:column}  /* fixed like Linear: one busy column must not fill the page */
.col.slim{flex:0 0 36px;width:36px;align-self:flex-start;align-items:center;gap:8px;padding:12px 0;margin-top:8px;border-radius:6px;background:var(--app);color:var(--mute);font-size:11.5px}
.col.slim span{writing-mode:vertical-rl;font-weight:500;font-size:12px;color:var(--text2)}
.colh{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px;font-weight:500;white-space:nowrap;position:sticky;top:0;z-index:2;background:var(--bg)}
.colh .cnt{font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.card:hover{border-color:color-mix(in srgb,var(--text) 18%,var(--line))}
.card.done .ttl{color:var(--text2)}
.card:focus-visible,.nav:focus-visible,.dtab:focus-visible,.ib:focus-visible{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 45%,transparent);transform:scale(1.02)}}
.c1{display:flex;align-items:center;gap:6px;height:18px;color:var(--mute);font-size:12px;min-width:0}
.c1 .id{font-variant-numeric:tabular-nums;flex:none}
.who{margin-left:auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who.need{color:var(--human);font-weight:500}
.who i{width:6px;height:6px;border-radius:50%;background:var(--human);flex:none}
.who .rund{background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.ttl{font-weight:500;line-height:1.4;color:var(--text);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c3{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:12px;margin-top:2px;min-width:0}
.c3 .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c3 .st svg{flex:none}
.c3 .lb{overflow:hidden;text-overflow:ellipsis}
.c3 .time{margin-left:auto;color:var(--mute);font-size:11.5px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;color:var(--text2);background:var(--panel);white-space:nowrap}
.tag.wait{border-color:transparent;background:var(--human-soft);color:var(--human);font-weight:500}
.more{border:0;background:none;color:var(--mute);font-size:12px;padding:6px;cursor:pointer;border-radius:6px}
.more:hover{background:var(--hover);color:var(--text)}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;background:var(--line);color:var(--text2);font-size:9px;font-weight:600;flex:none}
.kicon{width:13px;height:13px;flex:none}
.empty-all{padding:80px 20px;text-align:center;color:var(--mute)}
.empty-all code{font-family:var(--mono);background:var(--app);padding:2px 6px;border-radius:4px}
.content.fill{display:flex;flex-direction:column;overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px;flex-wrap:wrap;flex:none}
.tbar .range{font-weight:500;white-space:nowrap}
.tbar .hint{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:28px;padding:0 10px;cursor:pointer;font-size:12px;box-shadow:var(--shadow)}
.btn:hover{background:var(--hover)}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:11.5px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.tint{background-color:color-mix(in srgb,var(--c) 34%,var(--panel))}
.hatch{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--panel) 60%,transparent) 0 2px,transparent 2px 5px)}
.gw{--namew:300px;flex:1;min-height:200px;border-top:1px solid var(--line);background:var(--panel);overflow:auto;position:relative;cursor:grab;overscroll-behavior-x:contain}
.gw.drag{cursor:grabbing;user-select:none}
.ghead{position:sticky;top:0;z-index:5;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.gcorner{position:sticky;left:0;z-index:6;width:var(--namew);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 16px 7px;color:var(--mute);font-size:11.5px;height:52px}
.gaxis{position:relative;height:52px;flex:none}
.maj{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap}
.maj span{position:sticky;left:calc(var(--namew) + 8px);padding:5px 8px;display:inline-block}
.maj.today span{color:var(--brand)}
.min{position:absolute;top:26px;height:26px;border-left:1px solid var(--line2);font-size:11px;color:var(--mute);padding:5px 0 0 6px;white-space:nowrap}
.gbody{position:relative}
.ggrid{position:absolute;top:0;bottom:0;left:var(--namew);pointer-events:none}
.ggrid .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.ggrid .gl.major{background:var(--line)}
.ggrid .off{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--text) 2.5%,transparent)}
.ggrid .now{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);z-index:2}
.nowtag{position:absolute;top:28px;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;z-index:3}
.grow2{display:flex;height:36px;border-bottom:1px solid var(--line2)}
.grow2:hover .gname{background:var(--hover)}
.gname{position:sticky;left:0;z-index:4;width:var(--namew);flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--panel);border-right:1px solid var(--line);cursor:pointer;min-width:0}
.gname .id{font-size:12px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.gname .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.gname .d{margin-left:auto;color:var(--mute);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.gtrack{position:relative;flex:none;cursor:inherit}
.bar{position:absolute;top:8px;height:20px;border-radius:4px;color:var(--text);font-size:11px;font-weight:500;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:clip;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);min-width:2px;cursor:pointer}
.bar:hover{z-index:3;box-shadow:inset 0 0 0 1px var(--c)}
.gempty{padding:60px 20px;color:var(--mute);text-align:center;position:sticky;left:0;width:min(100%,900px)}
.dur{padding:0 0 24px}
.sum{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:32px;align-items:center;border-top:1px solid var(--line);padding:16px}
.sum .k b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .k span{color:var(--mute);font-size:12px}
.sum .k.h b{color:var(--human)}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.sumlg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--mute)}
.sumlg span{display:flex;align-items:center;gap:5px}
.sumlg i{width:8px;height:8px;border-radius:2px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.dl{border-top:1px solid var(--line)}
.dh,.dr{display:grid;grid-template-columns:110px minmax(160px,1.2fr) 128px minmax(240px,2fr) 70px;align-items:center;gap:14px}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);height:34px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:11.5px}
.dax{position:relative;height:100%}
.dax span{position:absolute;top:9px;transform:translateX(-50%);font-size:10.5px;white-space:nowrap}
.dax span:first-child{transform:none}
.dax span:last-child{transform:translateX(-100%)}
.dg{padding:14px 16px 4px;font-size:12px;font-weight:500;color:var(--text2);display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line2)}
.dh+.dg{border-top:0}
.dg small{color:var(--mute);font-weight:400}
.dr{height:36px;cursor:pointer;border-radius:5px;margin:0 4px;padding:0 12px}
.dr:hover{background:var(--hover)}
.dr .idc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.dr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dr .tag{justify-self:start;border:0;padding:0;background:none;height:auto;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dtrack{position:relative;height:14px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--tick) - 1px),var(--line2) calc(var(--tick) - 1px) var(--tick))}
.dbar{position:absolute;top:0;bottom:0;left:0;display:flex;gap:1px;border-radius:4px;overflow:hidden}
.dbar i{height:100%;min-width:2px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.dbar.over{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.dr .tot{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;white-space:nowrap}
.dr.running .tot{color:var(--text)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12px;min-width:180px;display:none}
.tip b{display:flex;align-items:center;gap:6px;font-weight:500}
.tip small{display:block;color:var(--mute);margin-top:2px}
.ov{position:fixed;inset:0;background:rgba(15,16,20,.32);display:none;place-items:center;z-index:20}
.ov.on{display:grid;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(1240px,94vw);height:min(860px,90vh);background:var(--bg);border-radius:10px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(4px);opacity:0}}
.ov.full .modal{width:100vw;height:100vh;border-radius:0;border:0}
.mh{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 0 20px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.mh .id{color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.mh .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:28px;height:28px;border:0;background:none;border-radius:5px;display:grid;place-items:center;color:var(--mute);cursor:pointer;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg{width:15px;height:15px}
.mst{display:inline-flex;align-items:center;gap:6px;margin-left:8px;color:var(--text2);font-size:12.5px;white-space:nowrap;flex:none}
.mh .who{margin-left:10px;flex:none}
.mb{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.ov.noside .mb{grid-template-columns:1fr}
.mmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.dtabs{display:flex;gap:20px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.dtab{display:flex;align-items:center;gap:6px;border:0;background:none;padding:11px 0 10px;color:var(--mute);font-weight:500;cursor:pointer;border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtab:hover{color:var(--text)}
.dtab.on{color:var(--text);border-bottom-color:var(--text)}
.dtab .wt{font-size:10px;padding:0 5px;border-radius:4px;background:color-mix(in srgb,var(--c-dev) 22%,transparent);color:color-mix(in srgb,var(--c-dev) 55%,var(--text))}
.doc{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.doc .pad{padding:40px 56px 72px}
.doc iframe{width:100%;flex:1;border:0;display:block;background:#fff}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px;flex:none;min-width:0}
.pvbar code{font-family:var(--mono);font-size:11px;background:var(--app);padding:1px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbar a{color:var(--brand);text-decoration:none;white-space:nowrap}
.md{max-width:760px;margin:0 auto;color:var(--text2);font-size:14px;line-height:1.7;word-wrap:break-word}
.md h1{font-size:22px;color:var(--text);letter-spacing:-.015em;margin:0 0 14px;font-weight:600}
.md h2{font-size:15.5px;color:var(--text);margin:28px 0 8px;font-weight:600}
.md h3,.md h4{font-size:14.5px;color:var(--text);margin:22px 0 8px;font-weight:600}
.md a{color:var(--brand)}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--mute)}
.md .tw{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:8px}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md th{color:var(--mute);font-weight:500;text-align:left;font-size:12px}
.md td,.md th{padding:7px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md pre{background:var(--app);border:1px solid var(--line);padding:14px 16px;border-radius:8px;overflow:auto}
.md code{font-family:var(--mono);font-size:12.5px}
.md :not(pre)>code{background:var(--app);padding:1px 5px;border-radius:4px;border:1px solid var(--line2)}
.md pre.mermaid[data-done]{background:var(--panel);text-align:center}
.mside{border-left:1px solid var(--line);overflow:auto;background:var(--bg);padding-bottom:24px}
.mside .blk.dec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:20px 20px 4px;padding:16px;box-shadow:var(--shadow)}
.ov.noside .mside{display:none}

  if(e.target.closest("#pm a")){pmClose();return}
  if(e.target.closest("[data-pcopy]")){const p=data.projects.find(x=>x.id===$("#pm").dataset.id);pmClose();if(p)navigator.clipboard?.writeText(p.root).then(()=>toast(esc(tr("copied"))));return}
  if(e.target.closest("[data-prm]")){const p=data.projects.find(x=>x.id===$("#pm").dataset.id);pmClose();if(p&&confirm(tr("rmAsk").replace("{p}",p.name)))homePost("/api/projects/remove",{id:p.id});return}
  if(e.target.closest("[data-padd]")){addOpen();return}
  if(e.target.closest("[data-aclose]")||e.target===$("#av")){$("#av").classList.remove("on");return}
  if(e.target.closest("[data-aadd]")){homePost("/api/projects/add",{dir:$("#aDir").value});return}
  const gw=e.target.closest("#gw");if(gw?.dataset.dragged){delete gw.dataset.dragged;return}  // the end of a pan, not a click
  const z=e.target.closest("[data-z]");if(z){zoomTo(+z.dataset.z);return}
  if(e.target.closest("[data-now]")){const g=$("#gw");g.scrollLeft=(Date.now()-gT0)*pph/36e5-(g.clientWidth-namew(g))*.8;return}
  const t=e.target.closest("[data-tl]");if(t){tl=t.dataset.tl;render();return}
  if(e.target.closest("[data-more]")){allDone=!allDone;render();return}
  const ch=e.target.closest("[data-only]");if(ch){only=only===ch.dataset.only?"":ch.dataset.only;render();return}
  if(e.target.id==="follow"){follow=e.target.checked;gRows();return}
  const act=e.target.closest("[data-act]");if(act){const ov=$("#ov");if(act.dataset.act==="close")closeM();else{ov.classList.toggle(act.dataset.act==="full"?"full":"noside");if(act.dataset.act==="full")modal()}return}
  const dec=e.target.closest("[data-dec]");if(dec){decide(dec.dataset.dec);return}
  if(e.target.closest("[data-new]")){newOpen();return}
  if(e.target.closest("[data-wiz]")){if(depBlocked()){toast(esc(tr("depNeed")));$("#deps")?.scrollIntoView({behavior:"smooth",block:"center"});return}wizOpen();return}
  const df=e.target.closest("[data-dfix]");if(df){depFix(df.dataset.dfix);return}
  const dc=e.target.closest("[data-dcopy]");if(dc){navigator.clipboard?.writeText(dc.dataset.dcopy).then(()=>toast(esc(tr("copiedCmd"))));return}
  if(e.target.closest("[data-dhide]")){try{localStorage.setItem("mark.hideApp","1")}catch{}renderHome();return}
  if(e.target.closest("[data-drecheck]")){loadDeps();return}
  if(e.target.closest("[data-wclose]")||e.target===$("#wv")){$("#wv").classList.remove("on");return}
  if(e.target.closest("[data-wcreate]")){wizCreate();return}
  {const b=e.target.closest("[data-wpick]");if(b){wizPick(b);return}}
  const wd=e.target.closest("[data-wdel]");if(wd){if(confirm(tr("wDiscard")+"?"))homePost(`/api/wizard/${wd.dataset.wdel}/discard`,{});return}
  if(e.target.closest("[data-model]")){modelOpen();return}
  if(e.target.closest("[data-mclose]")||e.target===$("#mv")){$("#mv").classList.remove("on");return}
  if(e.target.closest("[data-msave]")){modelSave();return}
  if(e.target.closest("[data-madd]")){modelForm();return}
  if(e.target.closest("[data-mcancel]")){mEdit=null;modelList();return}
  const mp=e.target.closest("[data-muse],[data-medit],[data-mdel]");if(mp){const p=data.model.profiles[+(mp.dataset.muse??mp.dataset.medit??mp.dataset.mdel)];if(!p)return;
    if(mp.dataset.medit!=null)modelForm(+mp.dataset.medit);
    else if(mp.dataset.mdel!=null){if(confirm(tr("delAsk").replace("{m}",p.name)))modelPost({action:"delete",name:p.name})}
    else if(p.name!==data.model.active)modelPost({action:"use",name:p.name});return}
  if(e.target.closest("[data-preset]")){$("#mUrl").value="https://api.deepseek.com/anthropic";$("#mModel").value="deepseek-chat";return}
  if(e.target.closest("[data-nclose]")||e.target===$("#nv")){newClose();return}
  if(e.target.closest("[data-create]")){create();return}
  if(e.target.closest("[data-send]")){chatSend();return}
  if(e.target.closest("[data-asksend]")){askSend();return}
  if(e.target.closest("[data-cstop]")){fetch(HOME?`/api/wizard/${wiz}/stop`:"api/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(HOME?{}:{ticket:open.id})}).then(load);return}
  if(e.target.closest("[data-stop]")){fetch("api/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(load);return}
  const tab=e.target.closest(".dtab");if(tab){open.tab=tab.dataset.tab;modal();return}
  const o=e.target.closest("[data-open]");if(o){openM(o.dataset.open,o.dataset.tab);return}
  if(e.target===$("#ov"))closeM();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#pm").classList.contains("on"))pmClose();else if($("#av").classList.contains("on"))$("#av").classList.remove("on");else if($("#wv").classList.contains("on"))$("#wv").classList.remove("on");else if($("#mv").classList.contains("on"))$("#mv").classList.remove("on");else if($("#nv").classList.contains("on"))newClose();else if(document.activeElement===$("#q"))$("#q").blur();else if(open)closeM()}
  else if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&document.activeElement?.id==="cText"){e.preventDefault();chatSend()}
  else if(e.key==="Enter"&&document.activeElement?.id==="aDir")homePost("/api/projects/add",{dir:$("#aDir").value});
  else if(e.key==="Enter"&&document.activeElement?.dataset.open)openM(document.activeElement.dataset.open);
  else if(e.key==="/"&&!open&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"")){e.preventDefault();$("#q").focus()}});
document.querySelectorAll(".nav[data-v]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav[data-v]").forEach(x=>x.classList.toggle("on",x===b));view=b.dataset.v;render()});
document.querySelectorAll(".kf").forEach(b=>b.onclick=()=>{document.querySelectorAll(".kf").forEach(x=>x.classList.toggle("on",x===b));kind=b.dataset.k;render()});
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));scope=b.dataset.k;render()});
document.addEventListener("change",e=>{if(e.target.id==="mProv")modelProv();if(e.target.name==="dOpt"){$("#dPick").hidden=e.target.value==="other";$("#dPlain").hidden=e.target.value!=="other"}});
$("#q").oninput=e=>{q=e.target.value.toLowerCase();render()};
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest("[data-tip]");if(!el||$("#gw.drag")){tip.style.display="none";return}
  tip.innerHTML=el.dataset.tip;tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+"px";tip.style.top=(e.clientY+h+20>innerHeight?e.clientY-h-12:e.clientY+16)+"px"});
addEventListener("resize",()=>gRows());
addEventListener("hashchange",()=>{if(HOME&&data)render()});
addEventListener("scroll",pmClose,true);addEventListener("resize",pmClose);
function connect(){
  const es=new EventSource("events"),live=$("#live");
  es.onopen=()=>{live.classList.remove("off");$("#liveText").textContent=tr("live");load();if(HOME)loadDeps()};
  es.onmessage=()=>load();
  es.onerror=()=>{live.classList.add("off");$("#liveText").textContent=tr("offline")}; // EventSource retries by itself
}
setInterval(()=>{if(data&&!open)render()},60000); // keep "x min ago" fresh
// The window `mark board` opened carries a one-time key (#k=): trade it for the session cookie, then drop it.
async function login(){const m=location.hash.match(/^#k=([\w-]+)/);if(!m)return;history.replaceState(null,"",location.pathname+location.search);
  try{await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({k:m[1]})})}catch{}}
login().then(load).then(connect);
</script>
