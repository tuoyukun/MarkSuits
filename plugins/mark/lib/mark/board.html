<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Board</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfc;--app:#f4f5f7;--panel:#ffffff;--line:#e8e9ed;--line2:#eff0f3;--hover:#f2f3f5;
  --text:#18191c;--text2:#4b4f58;--mute:#8a8f98;--faint:#b7bbc3;
  --brand:#5e6ad2;--brand-soft:#eef0fc;--human:#f2994a;--human-soft:#fff3e8;--ok:#26b562;--bad:#eb5757;
  --c-req:#a37cf0;--c-des:#e5629b;--c-plan:#3d9be9;--c-dev:#f2c94c;--c-qa:#4cb782;--c-merge:#5e6ad2;--c-block:#eb5757;--c-done:#95a2b3;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.03);
  --shadow-lg:0 24px 64px rgba(16,24,40,.18),0 2px 8px rgba(16,24,40,.08);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012;--app:#141517;--panel:#1b1c1f;--line:#26282d;--line2:#212327;--hover:#222428;
  --text:#ecedef;--text2:#b4b7bd;--mute:#7c808a;--faint:#4f535b;--brand-soft:#23253a;--human-soft:#33261a;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 64px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{--bg:#0f1012;--app:#141517;--panel:#1b1c1f;--line:#26282d;--line2:#212327;--hover:#222428;--text:#ecedef;--text2:#b4b7bd;--mute:#7c808a;--faint:#4f535b;--brand-soft:#23253a;--human-soft:#33261a;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 64px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--text);font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.sb{display:flex;flex-direction:column;padding:12px 10px;gap:2px;border-right:1px solid var(--line);min-width:0}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;min-width:0}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#6f7bf7,#4553c9);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.ws b{font-size:14px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws small{display:block;color:var(--mute);font-size:11px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--text2);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.nav svg{width:16px;height:16px;flex:none;color:var(--mute)}
.nav .n{margin-left:auto;font-size:11px;color:var(--mute)}
.nav .n.h{background:var(--human);color:#fff;border-radius:99px;padding:0 6px;font-weight:600}
.nav .n.h:empty,.nav .n.h.zero{display:none}
.sbh{font-size:11px;font-weight:500;color:var(--mute);padding:16px 8px 4px}
.sbfoot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.live{display:flex;align-items:center;gap:7px;color:var(--text2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.sbfoot code{font-family:var(--mono);font-size:11px}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg);border-radius:10px 0 0 0;margin-top:8px;border:1px solid var(--line);border-right:0;border-bottom:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.crumb{display:flex;gap:6px;align-items:center;font-weight:500;white-space:nowrap}
.crumb span{color:var(--mute);font-weight:400}
.seg{display:flex;background:var(--app);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:5px;color:var(--mute);cursor:pointer;font-size:12px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.grow{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 8px;height:28px;width:220px;color:var(--mute)}
.search input{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--text);min-width:0}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mute);background:var(--app)}
.content{flex:1;overflow:auto;min-height:0}
.stats{display:flex;gap:28px;padding:16px 22px 4px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12px}
.stat.h b{color:var(--human)}
.content:has(>.board){display:flex;flex-direction:column}
.board{display:flex;gap:12px;padding:14px 18px 28px;align-items:stretch;flex:1 0 auto}
.col{flex:0 0 288px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--text) 3.5%,var(--bg));border-radius:12px;padding:2px 8px 8px}
.colh{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px;font-weight:600}
.colh .cnt{font-weight:500;font-size:11.5px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 7px;line-height:18px}
.cards{display:flex;flex-direction:column;gap:8px}
.emptyc{height:96px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s,transform .15s}
.card:hover{box-shadow:0 6px 18px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);border-color:color-mix(in srgb,var(--text) 14%,var(--line));transform:translateY(-1px)}
.card.wait{box-shadow:inset 3px 0 0 var(--human),var(--shadow)}
.card.wait:hover{box-shadow:inset 3px 0 0 var(--human),0 6px 18px rgba(16,24,40,.08)}
.card:focus-visible,.nav:focus-visible,.dtab:focus-visible,.ib:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 45%,transparent);transform:scale(1.02)}}
.c1{display:flex;align-items:center;gap:7px;height:20px;color:var(--mute);font-size:11.5px}
.c1 .id{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.c1 .av{margin-left:auto}
.ttl{font-weight:500;font-size:13.5px;line-height:1.45;color:var(--text);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.tags{display:flex;gap:6px;height:22px;align-items:center;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;color:var(--text2);background:var(--panel);white-space:nowrap}
.tag.wait{border-color:transparent;background:var(--human-soft);color:var(--human);font-weight:500}
.cf{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line2);color:var(--mute);font-size:11.5px;height:31px}
.pipe{display:flex;gap:3px}
.pipe i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.cf .meta{display:inline-flex;align-items:center;gap:4px}
.cf .meta svg{width:13px;height:13px}
.cf .time{margin-left:auto;white-space:nowrap}
.more{border:0;background:none;color:var(--mute);font-size:12px;padding:6px;cursor:pointer;border-radius:6px}
.more:hover{background:var(--hover);color:var(--text)}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:600;flex:none}
.kicon{width:14px;height:14px;flex:none}
.empty-all{padding:80px 20px;text-align:center;color:var(--mute)}
.empty-all code{font-family:var(--mono);background:var(--app);padding:2px 6px;border-radius:4px}
.content.fill{display:flex;flex-direction:column;overflow:hidden}
.fill .stats{flex:none}
.tbar{display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap;flex:none}
.tbar .range{font-weight:600;white-space:nowrap}
.tbar .hint{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:28px;padding:0 10px;cursor:pointer;font-size:12px;box-shadow:var(--shadow)}
.btn:hover{background:var(--hover)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:12px;align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.hatch{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.gw{--namew:300px;flex:1;min-height:200px;margin:0 18px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:auto;position:relative;cursor:grab;overscroll-behavior-x:contain;box-shadow:var(--shadow)}
.gw.drag{cursor:grabbing;user-select:none}
.ghead{position:sticky;top:0;z-index:5;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.gcorner{position:sticky;left:0;z-index:6;width:var(--namew);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 14px 6px;color:var(--mute);font-size:11.5px;height:52px}
.gaxis{position:relative;height:52px;flex:none}
.maj{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.maj span{position:sticky;left:calc(var(--namew) + 8px);padding:5px 8px;display:inline-block}
.maj.today span{color:var(--brand)}
.min{position:absolute;top:26px;height:26px;border-left:1px solid var(--line2);font-size:11px;color:var(--mute);padding:5px 0 0 6px;white-space:nowrap}
.gbody{position:relative}
.ggrid{position:absolute;top:0;bottom:0;left:var(--namew);pointer-events:none}
.ggrid .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.ggrid .gl.major{background:var(--line)}
.ggrid .off{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--text) 2.5%,transparent)}
.ggrid .now{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);z-index:2}
.nowtag{position:absolute;top:28px;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;z-index:3}
.grow2{display:flex;height:40px;border-bottom:1px solid var(--line2)}
.grow2:hover .gname{background:var(--hover)}
.gname{position:sticky;left:0;z-index:4;width:var(--namew);flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-right:1px solid var(--line);cursor:pointer;min-width:0}
.gname .id{font-family:var(--mono);font-size:11px;color:var(--mute);flex:none}
.gname .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.gname .d{margin-left:auto;color:var(--mute);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.gtrack{position:relative;flex:none;cursor:inherit}
.bar{position:absolute;top:10px;height:20px;border-radius:4px;color:#fff;font-size:11px;font-weight:500;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:clip;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);min-width:2px;cursor:pointer}
.bar:hover{filter:brightness(1.08);z-index:3;outline:2px solid var(--panel)}
.gempty{padding:60px 20px;color:var(--mute);text-align:center;position:sticky;left:0;width:min(100%,900px)}
.dur{padding:0 18px 30px}
.sum{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.sum .k b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .k span{color:var(--mute);font-size:12px}
.sum .k.h b{color:var(--human)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.sumlg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--mute)}
.sumlg span{display:flex;align-items:center;gap:5px}
.sumlg i{width:8px;height:8px;border-radius:2px}
.dl{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.dh,.dr{display:grid;grid-template-columns:110px minmax(160px,1.2fr) 128px minmax(240px,2fr) 70px;align-items:center;gap:14px}
.dh{position:sticky;top:0;z-index:2;background:var(--panel);height:36px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:11.5px;border-radius:10px 10px 0 0}
.dax{position:relative;height:100%}
.dax span{position:absolute;top:9px;transform:translateX(-50%);font-size:10.5px;white-space:nowrap}
.dax span:first-child{transform:none}
.dax span:last-child{transform:translateX(-100%)}
.dg{padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--text2);display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line2)}
.dh+.dg{border-top:0}
.dg small{color:var(--mute);font-weight:400}
.dr{height:40px;cursor:pointer;border-radius:6px;margin:0 4px;padding:0 12px}
.dr:hover{background:var(--hover)}
.dr .idc{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.dr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.dr .tag{justify-self:start}
.dtrack{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--tick) - 1px),var(--line2) calc(var(--tick) - 1px) var(--tick))}
.dbar{position:absolute;top:0;bottom:0;left:0;display:flex;gap:1px;border-radius:4px;overflow:hidden}
.dbar i{height:100%;min-width:2px}
.dbar.over{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.dr .tot{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-size:12px;white-space:nowrap}
.dr.running .tot{color:var(--brand);font-weight:500}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12px;min-width:180px;display:none}
.tip b{display:flex;align-items:center;gap:6px;font-weight:500}
.tip small{display:block;color:var(--mute);margin-top:2px}
.ov{position:fixed;inset:0;background:rgba(15,16,20,.42);backdrop-filter:blur(3px);display:none;place-items:center;z-index:20}
.ov.on{display:grid;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(1240px,94vw);height:min(860px,90vh);background:var(--bg);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.ov.full .modal{width:100vw;height:100vh;border-radius:0;border:0}
.mh{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.mh .id{font-family:var(--mono);font-size:12px;color:var(--mute);flex:none}
.mh .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:30px;height:30px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--mute);cursor:pointer;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg{width:16px;height:16px}
.mb{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.ov.noside .mb{grid-template-columns:1fr}
.mmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.dtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.dtab{display:flex;align-items:center;gap:6px;border:0;background:none;padding:7px 10px 9px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtab:hover{color:var(--text)}
.dtab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.dtab .wt{font-size:10px;padding:0 5px;border-radius:4px;background:color-mix(in srgb,var(--c-dev) 22%,transparent);color:color-mix(in srgb,var(--c-dev) 55%,var(--text))}
.doc{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.doc .pad{padding:28px 48px 60px}
.doc iframe{width:100%;flex:1;border:0;display:block;background:#fff}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px;flex:none;min-width:0}
.pvbar code{font-family:var(--mono);font-size:11px;background:var(--app);padding:1px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbar a{color:var(--brand);text-decoration:none;white-space:nowrap}
.md{max-width:860px;margin:0 auto;color:var(--text2);font-size:14px;line-height:1.7;word-wrap:break-word}
.md h1{font-size:24px;color:var(--text);letter-spacing:-.02em;margin:0 0 16px;font-weight:600}
.md h2{font-size:17px;color:var(--text);margin:28px 0 10px;font-weight:600}
.md h3,.md h4{font-size:14.5px;color:var(--text);margin:22px 0 8px;font-weight:600}
.md a{color:var(--brand)}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--mute)}
.md .tw{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:8px}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md th{background:var(--app);color:var(--text);font-weight:500;text-align:left}
.md td,.md th{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md pre{background:var(--app);border:1px solid var(--line);padding:14px 16px;border-radius:8px;overflow:auto}
.md code{font-family:var(--mono);font-size:12.5px}
.md :not(pre)>code{background:var(--app);padding:1px 5px;border-radius:4px;border:1px solid var(--line2)}
.md pre.mermaid[data-done]{background:var(--panel);text-align:center}
.mside{border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
.ov.noside .mside{display:none}
.blk{padding:16px 18px;border-bottom:1px solid var(--line2)}
.blk h5{margin:0 0 10px;font-size:11.5px;font-weight:500;color:var(--mute)}
.prop{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:6px;padding:4px 0;font-size:12.5px}
.prop>span:first-child{color:var(--mute)}
.prop .v{display:flex;align-items:center;gap:6px;min-width:0}
.prop code{font-family:var(--mono);font-size:11px;color:var(--text2);overflow-wrap:anywhere}
.gate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.gate .ck{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;background:var(--ok);flex:none}
.gate code{font-family:var(--mono);font-size:11.5px}
.gate small{margin-left:auto;color:var(--mute);white-space:nowrap}
.none{color:var(--faint);font-size:12px}
.act{list-style:none;margin:0;padding:0;position:relative}
.act:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.act li{position:relative;display:flex;gap:10px;padding:0 0 14px}
.act .ico{width:17px;height:17px;flex:none;background:var(--panel);border-radius:50%;display:grid;place-items:center;z-index:1}
.act .tx{font-size:12.5px;color:var(--text2);line-height:1.45;min-width:0}
.act .tx b{color:var(--text);font-weight:500}
.act .tm{display:block;color:var(--mute);font-size:11.5px}
.act .note{display:block;margin-top:4px;background:var(--app);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12px;word-break:break-word}
.act .sha{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.toast{position:fixed;right:20px;bottom:20px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:10px 14px;border-radius:10px;font-size:12.5px;transform:translateY(20px);opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{transform:none;opacity:1}
.toast .id{font-family:var(--mono);color:var(--mute)}
.dec label{display:block;font-size:12px;color:var(--mute);margin:0 0 4px}
.dec select,.dec textarea{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 0 8px}
.dec textarea{resize:vertical}
.btn{font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;margin:0 0 12px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.dout{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;margin:0;color:var(--text2)}
.dout.bad{color:var(--c-block)}
.runlog{max-height:220px;overflow:auto;background:var(--app);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;margin:0 0 8px}
.tag.run{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.dec input{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 0 8px}
.top .btn{margin:0;white-space:nowrap}
.dq{font-size:13px;color:var(--text);margin:0 0 8px}
.dec .dopt{display:flex;color:var(--text);font-size:12.5px;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:0 0 6px;cursor:pointer}
.dec .dopt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.dec .dopt input{width:auto;margin:3px 0 0;flex:none}
.dopt b{font-weight:500;font-size:12.5px}.dopt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.dopt .rec{font-size:10.5px;color:var(--brand);margin-left:6px}.dopt .go{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:6px}
.nmodal{width:min(560px,94vw);height:auto;max-height:90vh}
.nmodal .pad{padding:16px 18px;overflow:auto}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:20px 28px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:760px;border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--brand-soft);color:var(--text);white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.ai.md p:first-child{margin-top:0}.msg.ai.md p:last-child{margin-bottom:0}
.msg.err{align-self:flex-start;color:var(--c-block);font-family:var(--mono);font-size:11.5px;padding:2px 14px}
.steps{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--mute);padding:0 14px;white-space:pre-wrap;word-break:break-all;max-width:760px}
.cin{border-top:1px solid var(--line);padding:10px 14px;flex:none}
.cin textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;margin:0 0 8px}
.crow{display:flex;align-items:center;gap:8px}.crow .btn{margin:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr}.sb{display:none}.main{margin:0;border-radius:0;border:0}
  .search{width:auto;flex:1}.crumb span,.crumb .p{display:none}.top{padding:0 16px}
  .board{padding:12px 16px}.stats{padding:14px 16px 0;gap:18px}.tbar{padding:10px 16px}.gw{margin:0 16px 16px;--namew:170px}.dur{padding:0 16px 24px}
  .dh,.dr{grid-template-columns:80px 1fr 1fr 56px}.dh>:nth-child(3),.dr>:nth-child(3){display:none}
  .mb{grid-template-columns:1fr}.mside{display:none}.doc .pad{padding:20px 16px}.modal{width:100vw;height:100vh;border-radius:0}
}

const LABELS={
 en:{drafting:"Drafting","review-requirement":"Requirement review",designing:"Designing","review-design":"Design review",planning:"Planning","review-plan":"Plan review",developing:"Developing","failed-impl":"Rework","design-qa":"Design QA",testing:"Testing","pending-merge":"Pending merge","blocked-plan":"Blocked: plan","blocked-spec":"Blocked: design","blocked-unclear":"Needs answer",passed:"Passed",superseded:"Superseded"},

 {k:"req",n:{en:"Requirement","zh-CN":"需求"},c:"--c-req",s:["drafting","review-requirement"],p:.12},

const tr=k=>(I18N[L]||I18N.en)[k]??I18N.en[k];
const label=s=>(LABELS[L]||LABELS.en)[s]||s||"?";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const isHuman=t=>t.side==="human";
const short=id=>esc(id.startsWith("general-")?`G-${id.slice(12,16)}-${id.slice(17,21)}`:id.split("-")[0].toUpperCase());  // general-YYYYMMDD-HHMMSS -> G-MMDD-HHMM
const ts=x=>x?new Date(x).getTime():NaN;
function ago(x){const m=(Date.now()-ts(x))/6e4,a=tr("ago");if(!(m>=0))return"";return m<1?a.s:m<60?a.m.replace("{n}",Math.round(m)):m<1440?a.h.replace("{n}",Math.round(m/60)):a.d.replace("{n}",Math.round(m/1440))}
function fmt(x){const d=new Date(x);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function dur(ms){const h=ms/36e5,n=x=>String(+x.toFixed(x<10?1:0));return h<1?Math.max(1,Math.round(h*60))+tr("min"):h<48?n(h)+tr("hours"):n(h/24)+tr("days")}

function icon(status,size=14){
  const st=stageOf(status),c=`var(${st.c})`;
  if(st.k==="done")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${status==="passed"?"var(--brand)":c}"/><path d="${status==="passed"?"M4.3 7.2 6.2 9l3.5-3.8":"M4.5 7h5"}" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(st.k==="block")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${c}"/><path d="M7 3.8v3.6M7 9.6v.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  const r=3,len=2*Math.PI*r;

  const es=new EventSource("/events"),live=$("#live");
  es.onopen=()=>{live.classList.remove("off");$("#liveText").textContent=tr("live");load()};
  es.onmessage=()=>load();
  es.onerror=()=>{live.classList.add("off");$("#liveText").textContent=tr("offline")}; // EventSource retries by itself
}
setInterval(()=>{if(data&&!open)render()},60000); // keep "x min ago" fresh
// The window `mark board` opened carries a one-time key (#k=): trade it for the session cookie, then drop it.
async function login(){const m=location.hash.match(/^#k=([\w-]+)/);if(!m)return;history.replaceState(null,"",location.pathname+location.search);
  try{await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({k:m[1]})})}catch{}}
login().then(load).then(connect);
</script>
